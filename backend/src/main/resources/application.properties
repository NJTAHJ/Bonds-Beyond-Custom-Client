spring.data.mongodb.database=digiDB
spring.data.mongodb.uri=${MONGO_DB_URI}
spring.data.mongodb.port=${PORT:8081}
server.servlet.session.timeout=200m
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
# Enable Gzip Compression (shrinks React JS/CSS build by 75%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Force Browsers to Cache Static Files locally for 365 Days
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true